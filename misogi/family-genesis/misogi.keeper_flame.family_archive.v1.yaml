final_artifact: A first-edition Family Flame Book, either printed or digital, containing a title page, table of contents, at least two polished family story chapters, at least eight labeled photographs or artifacts, a simple family timeline, selected letters or excerpts, a list of questions still waiting to be asked, and the student's reflection.
final_demonstration: The student presents the Family Flame Book to the family in a 5-10 minute presentation, reads one favorite story aloud, shows the timeline and photographs, and asks relatives for three stories to preserve next.
evidence_required:
- Copies or photos of letters sent
- Interview notes or audio/video recording with permission
- Labeled photo or artifact pages
- Family timeline
- Final Family Flame Book as PDF, binder, or printed booklet
- Student reflection
parent_review_rubric:
  complete:
  - At least six letters or written messages were drafted during the project.
  - At least one live interview was completed with a grandparent or elder.
  - At least two family stories were shaped into readable chapters.
  - At least eight photographs or artifacts were labeled.
  - The final artifact is organized, presentable, and suitable for the family archive.
  - The student showed courtesy, patience, and care with private family memories.
  needs_revision:
  - The archive exists but lacks organization or clear labels.
  - The final artifact contains stories but needs editing for clarity, accuracy, or kindness.
  - The student gathered material but did not yet connect it into a coherent family artifact.
  - A parent needs to review privacy-sensitive details before the artifact is shared.
  incomplete:
  - No elder interview was completed.
  - The student did not gather enough stories, photos, or letters to create a meaningful artifact.
  - The final artifact is missing or too disorganized to preserve family memory.
portfolio_description: I served as Keeper of the Flame for my family by writing to my grandparents, collecting family stories, interviewing an elder, labeling photographs, building a timeline, and creating the first edition of our Family Flame Book.
parent_notes: Help with addresses, scheduling, recording consent, printing, and privacy review. Encourage handwritten letters when possible, but allow email or typed letters if that keeps the correspondence moving. Treat this as the beginning of a long family archive, not the end.
safety_notes: Ask permission before recording. Do not publish private family details online. Let elders skip any question. If a painful memory arises, receive it gently and ask a parent for help deciding how or whether to include it.
