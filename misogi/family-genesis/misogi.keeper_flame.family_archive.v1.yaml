id: misogi.keeper_flame.family_archive.v1
title: 'Keeper of the Flame: A Family Story Archive'
archetype: Communicator
theme: Home, Place, and Service
duration_weeks: 12
difficulty: 4
estimated_total_hours: 36
source_modules:
- StoryKeeper-inspired oral history
- Family correspondence
- Formation Ledger
tags:
- family history
- letter writing
- oral history
- grandparents
- portfolio
- service
formation_goal: Become a trustworthy keeper of family memory by gathering stories, practicing courteous letter writing, conducting at least one elder interview, and shaping the first edition of a family archive.
description: The student accepts the charge of Keeper of the Flame and begins a living family story archive. Over twelve weeks she writes to grandparents, gathers memories, labels photographs, builds a simple timeline, conducts at least one live interview, and creates a first-edition Family Flame Book that can continue growing for years.
why_it_matters: Families are strengthened when their stories are remembered with gratitude and care. This misogi trains attention, humility, patience, good questions, clear writing, and reverence for those who came before.
weekly_milestones:
- week: 1
  title: Receive the Charge
  description: Define the role of Keeper of the Flame and set up the archive structure.
  finished_means: A binder or digital folder exists with sections for letters, interviews, photos, timeline, and finished stories.
- week: 2
  title: Open the Door by Letter
  description: Write the first warm letter to grandparents explaining the project and asking permission to send story questions.
  finished_means: At least one thoughtful letter is written, reviewed, and sent.
- week: 3
  title: Build the Question Treasure Chest
  description: Create and organize a bank of story questions for letters and interviews.
  finished_means: At least twenty-five questions are sorted into useful categories, with eight chosen for a first interview.
- week: 4
  title: Send One Prompt
  description: Send a focused story prompt that invites one vivid memory rather than a whole life story.
  finished_means: A second letter or message is sent with one clear story prompt and an invitation to respond.
- week: 5
  title: Become a Photo Detective
  description: Gather and label family photographs, then ask elders for missing details.
  finished_means: At least eight photos or artifacts are labeled, and at least two photo questions are sent.
- week: 6
  title: Plant the Family Timeline
  description: Create a simple timeline to organize people, places, dates, moves, and major events.
  finished_means: A timeline with at least fifteen entries and three open mysteries is created.
- week: 7
  title: Practice Listening
  description: Practice interviewing with a parent or sibling before speaking with a grandparent.
  finished_means: A short practice interview is completed and reflected upon.
- week: 8
  title: Conduct the First Flame Interview
  description: Interview a grandparent or elder by phone, video, or face-to-face, with permission to record if possible.
  finished_means: One real interview is completed and preserved as notes, audio, or video.
- week: 9
  title: Write the First Story Chapter
  description: Turn one collected memory into a polished family story chapter.
  finished_means: A 500-900 word story chapter is drafted, revised, and saved.
- week: 10
  title: Gather a Second Story
  description: Collect one more story, ideally from another grandparent or from a different season of life.
  finished_means: A second story is gathered by letter, notes, or interview and added to the archive.
- week: 11
  title: Build the Family Flame Book
  description: Assemble the first edition family artifact.
  finished_means: A book, binder, or PDF includes a title page, contents, two stories, timeline, photos, and future questions.
- week: 12
  title: Present the Flame
  description: Share the finished artifact with the family and ask what should be preserved next.
  finished_means: The student gives a short family presentation and completes a final reflection.
