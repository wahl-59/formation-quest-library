id: quest.keeper_flame.receive_charge.v1
title: 'Receive the Charge: Keeper of the Flame'
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Beginner
estimated_time: 90
source_module: Keeper of the Flame Family Archive
tags:
- family history
- calling
- archive
- reflection
why_it_matters: A family story keeper needs to understand her charge before she starts collecting names and dates.
instructions:
- 'Write a half-page reflection answering: What does it mean to be the Keeper of the Flame for our family?'
- Make a list of grandparents and elders who might have stories to share.
- 'Choose where the archive will live: binder, notebook, digital folder, or a combination.'
- Create sections labeled Letters, Interviews, Photos, Timeline, Finished Stories, and Questions Still Waiting.
deliverables:
- A reflection page
- A list of elders to contact
- A photo or screenshot of the archive structure
evidence_required:
- text
- image_or_pdf
finished_means: The archive has a clear home and the student can explain her role as Keeper of the Flame.
parent_notes: Help her choose an archive format she can maintain without becoming overwhelmed.
