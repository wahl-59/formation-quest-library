id: quest.keeper_flame.second_story_hunt.v1
title: The Second Story Hunt
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Intermediate
estimated_time: 180
source_module: Keeper of the Flame Family Archive
tags:
- story gathering
- letter writing
- interview
- family history
why_it_matters: A second story widens the circle and keeps the archive from depending on only one memory.
instructions:
- 'Choose a second story topic: childhood home, courtship, work, faith, holidays, hardship, or family humor.'
- Send a new letter or schedule a shorter second interview.
- Collect at least one new story.
- Add any new names, places, or dates to the timeline.
- Save the story material in the archive.
deliverables:
- Second story notes, letter response, or interview notes
- Updated timeline
- Archive entry for the new story
evidence_required:
- text
- file_or_link
- audio_or_video_or_parent_observation
finished_means: A second family story has been gathered and connected to the growing archive.
parent_notes: This can be a shorter effort than the first interview. Momentum matters.
