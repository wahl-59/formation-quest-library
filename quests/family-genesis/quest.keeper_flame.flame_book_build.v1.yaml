id: quest.keeper_flame.flame_book_build.v1
title: Build the Family Flame Book
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Advanced
estimated_time: 360
source_module: Keeper of the Flame Family Archive
tags:
- bookmaking
- portfolio
- family archive
- craftsmanship
why_it_matters: The archive becomes a visible gift when it is ordered into something the family can hold, read, and pass down.
instructions:
- 'Create a title page for The Family Flame Book: First Edition.'
- Create a simple table of contents.
- Include at least two polished family story chapters.
- Include the family timeline.
- Include at least eight labeled photographs or artifacts.
- Include a section called Questions Still Waiting to Be Asked.
- Include a note explaining that this is a first edition, not the finished archive.
deliverables:
- A printed booklet, binder, or digital PDF
- Title page and table of contents
- At least two stories, eight labeled images or artifacts, timeline, and future questions
evidence_required:
- file
- image_or_pdf
finished_means: The Family Flame Book first edition is assembled, readable, and ready to present to the family.
parent_notes: Help with printing, binding, or PDF export. Do a privacy check before sharing.
