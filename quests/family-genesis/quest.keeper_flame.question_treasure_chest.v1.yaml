id: quest.keeper_flame.question_treasure_chest.v1
title: Build the Question Treasure Chest
archetype: Communicator
theme: Truth, Beauty, and Goodness
duration: 1 week
difficulty: Intermediate
estimated_time: 150
source_module: Keeper of the Flame Family Archive
tags:
- questions
- interviewing
- oral history
- listening
why_it_matters: The quality of a story often depends on the tenderness and precision of the question.
instructions:
- Write at least twenty-five possible family story questions.
- 'Sort them into categories: Childhood, Family Traditions, Work, Faith, Hard Times, Love, Holidays, Wisdom, and Funny Stories.'
- Choose the best eight questions for a first interview.
- Mark three questions as gentle warm-up questions.
- Ask a parent to remove or revise any question that might be too private, vague, or hard for a first interview.
deliverables:
- A categorized list of at least twenty-five questions
- A first-interview sheet with eight selected questions
- Three marked warm-up questions
evidence_required:
- text
- file
finished_means: The student has a usable question bank and a respectful first-interview question sheet.
parent_notes: Look for questions that invite scenes, senses, places, people, and choices rather than yes-or-no answers.
