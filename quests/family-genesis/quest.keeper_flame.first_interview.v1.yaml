id: quest.keeper_flame.first_interview.v1
title: The First Flame Interview
archetype: Communicator
theme: Courage and Self-Mastery
duration: 1 week
difficulty: Advanced
estimated_time: 240
source_module: Keeper of the Flame Family Archive
tags:
- interview
- oral history
- grandparents
- courage
why_it_matters: A live interview teaches courage, presence, gratitude, and the holy work of receiving another person's memory.
instructions:
- Schedule a phone, video, or face-to-face interview with a grandparent or elder.
- Share six to eight questions ahead of time.
- Ask permission before recording audio or video.
- Conduct the interview for twenty to forty-five minutes.
- Save the recording or notes in the archive.
- Send a thank-you note after the interview.
deliverables:
- Interview question sheet
- Interview notes or recording
- Thank-you note
evidence_required:
- audio_or_video_or_parent_observation
- text
finished_means: At least one real elder interview has been completed, preserved, and followed by thanks.
parent_notes: Help schedule and handle recording. Stay nearby if needed, but let the student ask the questions.
safety_notes: Recording requires clear permission. Let the elder skip any question.
