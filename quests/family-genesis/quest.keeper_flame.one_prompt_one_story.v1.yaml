id: quest.keeper_flame.one_prompt_one_story.v1
title: One Prompt, One Story
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Intermediate
estimated_time: 120
source_module: Keeper of the Flame Family Archive
tags:
- letter writing
- story prompt
- grandparents
- patience
why_it_matters: One clear question can open a bright window into the past without overwhelming the elder.
instructions:
- Choose one focused story prompt from the question treasure chest.
- Write a second letter or message centered around that one prompt.
- Invite the grandparent to answer by letter, email, voice memo, phone call, or in person.
- Ask whether there is a photograph, recipe, object, place, or song connected to the memory.
- Record the date sent and place a copy in the archive.
deliverables:
- A copy of the story-prompt letter
- A record of when and to whom it was sent
- Any response received, saved in the archive
evidence_required:
- text
- image_or_pdf
finished_means: A focused story prompt has been sent and the archive records what was asked and when.
parent_notes: Help her practice patient waiting. The goal is faithfulness, not instant replies.
