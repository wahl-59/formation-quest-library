id: quest.keeper_flame.listening_apprentice.v1
title: Practice the Art of Listening
archetype: Communicator
theme: Courage and Self-Mastery
duration: 1 week
difficulty: Beginner
estimated_time: 90
source_module: Keeper of the Flame Family Archive
tags:
- listening
- practice interview
- self-mastery
- conversation
why_it_matters: An interviewer is not a hunter grabbing facts, but a guest receiving a gift.
instructions:
- Interview a parent or sibling for ten to fifteen minutes.
- Use five prepared questions.
- 'Practice follow-up questions such as: What happened next? How did that feel? What do you remember seeing?'
- Do not interrupt while the other person is answering.
- Write three observations about what made the conversation better.
deliverables:
- Practice interview notes
- Three listening observations
- One thing to improve before the grandparent interview
evidence_required:
- text
- parent_observation
finished_means: The student has practiced listening and can name at least one way to conduct a better elder interview.
parent_notes: Give one encouragement and one concrete improvement.
