id: quest.keeper_flame.first_letter.v1
title: 'The First Letter: Opening the Door'
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Intermediate
estimated_time: 120
source_module: Keeper of the Flame Family Archive
tags:
- letter writing
- grandparents
- courtesy
- family history
why_it_matters: A good letter is a small bridge of love. It invites a story without demanding one.
instructions:
- Write a warm letter to one or more grandparents explaining the Keeper of the Flame project.
- Ask permission to send family story questions over the next several weeks.
- 'Include two easy questions: What is one happy memory from your childhood? What was my mom or dad like as a child?'
- Revise the letter for spelling, punctuation, gratitude, and warmth.
- Mail or email the letter.
deliverables:
- A copy or photo of the finished letter
- The date it was sent
- A short note naming what made the letter courteous
evidence_required:
- text
- image_or_pdf
- parent_observation
finished_means: At least one grandparent receives a thoughtful first letter introducing the family story project.
parent_notes: Review the letter before it is sent. Encourage good handwriting if she writes by hand.
safety_notes: Use parent-approved addresses or email accounts.
