id: quest.keeper_flame.photo_detective.v1
title: The Photo Detective
archetype: Communicator
theme: Creation and Wonder
duration: 1 week
difficulty: Intermediate
estimated_time: 180
source_module: Keeper of the Flame Family Archive
tags:
- photos
- artifacts
- observation
- family history
why_it_matters: Old photographs are quiet witnesses. Labeling them rescues faces and places from forgetfulness.
instructions:
- Choose at least eight family photographs or objects.
- For each one, label who, where, approximate date, and what seems to be happening.
- Mark unknown details with a question mark instead of guessing.
- Write one question for each photograph or object.
- Send two of the photo questions to grandparents or elders.
deliverables:
- Eight labeled photo or artifact entries
- A list of unknown details
- Two questions sent to elders
evidence_required:
- image_or_pdf
- text
finished_means: At least eight family photos or artifacts are labeled and preserved with honest notes about what is still unknown.
parent_notes: Help scan or photograph fragile items. Keep originals safe.
