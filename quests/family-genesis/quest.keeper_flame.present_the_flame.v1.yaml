id: quest.keeper_flame.present_the_flame.v1
title: Present the Flame
archetype: Communicator
theme: Home, Place, and Service
duration: 1 week
difficulty: Advanced
estimated_time: 180
source_module: Keeper of the Flame Family Archive
tags:
- presentation
- gratitude
- reflection
- family service
why_it_matters: A family artifact is completed not when it is printed, but when it is offered back in gratitude.
instructions:
- Prepare a five to ten minute family presentation.
- Read one favorite story aloud.
- Show the timeline and several photographs or artifacts.
- Share what was hardest, what was most beautiful, and what should happen next.
- Ask family members for three more stories that should be preserved.
- Write a final reflection called What I Learned as Keeper of the Flame.
deliverables:
- A short presentation
- Final reflection
- List of at least three next stories to gather
evidence_required:
- video
- text
- parent_observation
finished_means: The student has presented the Family Flame Book and named a path for continuing the archive.
parent_notes: Make this ceremonial and warm. A small dessert, candle, or family blessing would fit the spirit of the project.
