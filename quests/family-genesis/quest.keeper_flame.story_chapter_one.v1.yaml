id: quest.keeper_flame.story_chapter_one.v1
title: Turn a Memory into a Chapter
archetype: Communicator
theme: Truth, Beauty, and Goodness
duration: 1 week
difficulty: Advanced
estimated_time: 240
source_module: Keeper of the Flame Family Archive
tags:
- writing
- revision
- family story
- portfolio
why_it_matters: A raw memory becomes a gift to the family when it is shaped with truth, beauty, and care.
instructions:
- Choose one story from a letter, response, or interview.
- Write a 500-900 word chapter.
- Include setting, people, conflict or surprise, and why the story matters.
- Add one photograph, map, recipe, object, or short quotation if available.
- Ask a parent or the interviewed elder to check for accuracy and kindness.
- Revise the chapter and save the final version.
deliverables:
- Draft story chapter
- Revision notes
- Final revised chapter
evidence_required:
- file
- text
finished_means: One collected memory has become a revised family story chapter suitable for the Family Flame Book.
parent_notes: Help preserve the elder's voice while improving clarity and grammar.
