id: quest.the_investigator.the_expert_interview_challenge.v1
title: The Expert Interview Challenge
archetype: The Investigator
theme: Communication and Professional Inquiry
duration: 1 day
difficulty: Intermediate
estimated_time: 90
tags:
  - Communication
  - Planning
  - Professionalism
  - Interviewing
  - Active Listening
why_it_matters: Learning to engage with adults outside the immediate family circle builds confidence, refines the ability to ask thoughtful questions, and develops the professional habit of preparing for and executing a structured interaction.
instructions:
  - Identify an adult who possesses a specific skill or professional expertise that is of genuine interest.
  - Draft a list of five high-quality, open-ended questions designed to uncover how that person developed their expertise.
  - Contact the chosen individual to request a brief 15-minute interview, clearly stating the purpose and respecting their time.
  - Prepare a workspace with a notepad and pen to record key insights during the conversation.
  - Conduct the interview, focusing on active listening and asking follow-up questions based on the responses.
  - Summarize the three most valuable lessons learned from the conversation in a written reflection.
deliverables:
  - A list of prepared interview questions
  - A written summary of the three most valuable lessons learned
evidence_required:
  - text
  - parent_observation
finished_means: The Quest is complete when the interview has been conducted and the written summary of the three key lessons has been shared with a parent.
parent_notes: Help the student identify a contact who is approachable and willing to share their time. Encourage the student to handle the communication (email or phone) independently to practice professional outreach. Ensure the student has a clear time limit in mind before starting the call.
safety_notes: Ensure all communication with adults outside the family is conducted with parental awareness or oversight. If the interview is in person, ensure the location is public or appropriate.
